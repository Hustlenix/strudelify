name: Checks
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
jobs:
  catalog:
    name: JavaScript and catalog checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
